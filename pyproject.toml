[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-agent-factory"
version = "0.1.0"
description = "Local-first, durable, policy-enforced multi-agent factory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ultimate Agent Factory contributors"}]
keywords = ["agents", "local-first", "sqlite", "mcp", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
setup = ["keyring>=25.7,<26"]
browser = ["playwright>=1.64,<2"]
desktop = ["pyautogui>=0.9.54,<0.10"]
computer-use = [
  "keyring>=25.7,<26",
  "playwright>=1.64,<2",
  "pyautogui>=0.9.54,<0.10",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "pip-audit>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/shaahanikhaan/agentfactory"

[project.scripts]
uaf = "uaf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uaf = [
  "py.typed",
  "data/skills/*/*.md",
  "data/skills/*/*.json",
  "data/evals/*.json",
  "data/blueprints/*.json",
  "dashboard_assets/*.html",
  "dashboard_assets/*.js",
  "dashboard_assets/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: opt-in tests that use external services and credentials",
  "windows: Windows-only acceptance tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
# The formatter owns wrapping; generated SQL and schema strings may exceed the guide.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
